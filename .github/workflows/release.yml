name: Release

# 打 v* 标签时触发（如 v1.0.0），递归检出子模块后打包可运行版本
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建前端
        run: npm run build
      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FrontEnd/dist

  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, win-x64]
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 还原
        run: dotnet restore ToDoKits.Backend.slnx
      - name: 发布后端（${{ matrix.rid }} 自包含）
        run: >
          dotnet publish ToDoKits.Controllers/ToDoKits.Controllers.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:UseAppHost=true
          -o publish/${{ matrix.rid }}
      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.rid }}
          path: BackEnd/publish/${{ matrix.rid }}

  package-and-release:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          # 关闭 merge-multiple：保留各 artifact 独立子目录（frontend-dist / backend-linux-x64 / backend-win-x64），
          # 否则所有产物被压平到 artifacts/ 根，后续 cp artifacts/backend-win-x64/* 会因目录不存在而失败
      - name: 组装单包（后端 + 前端）
        run: |
          set -e
          # Windows 单包：后端 win-x64 + 前端 dist → wwwroot
          mkdir -p package/win/app
          cp -r artifacts/backend-win-x64/* package/win/app/
          mkdir -p package/win/app/wwwroot
          cp -r artifacts/frontend-dist/* package/win/app/wwwroot/
          # Linux 单包：后端 linux-x64 + 前端 dist → wwwroot
          mkdir -p package/linux/app
          cp -r artifacts/backend-linux-x64/* package/linux/app/
          mkdir -p package/linux/app/wwwroot
          cp -r artifacts/frontend-dist/* package/linux/app/wwwroot/
          # 纯前端静态产物
          cp -r artifacts/frontend-dist package/frontend-www
      - name: 压缩为可运行版本
        run: |
          cd package
          zip -r -q ../ToDoKits-win-x64.zip win
          zip -r -q ../ToDoKits-linux-x64.zip linux
          zip -r -q ../ToDoKits-frontend-www.zip frontend-www
      - name: 生成 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ToDoKits-win-x64.zip
            ToDoKits-linux-x64.zip
            ToDoKits-frontend-www.zip
          # 关闭自动生成 release notes：其内部会调用 generate-notes API，
          # 对 GITHUB_TOKEN 报 403 (Resource not accessible by integration)。
          # 仅创建 Release + 上传产物，需 contents: write（workflow 已声明）。
          generate_release_notes: false
